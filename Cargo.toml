[package]
name = "vpnshare"
version = "3.0.0"
edition = "2021"
rust-version = "1.80"
description = "SOCKS5/HTTP proxy that sends Iranian traffic out of the modem and everything else through the VPN"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
ahash = "0.8"
sha2 = "0.10"
base64 = "0.22"
# native-tls = Schannel on Windows (no cmake/NASM needed); "socks" lets the updater use a socks5 upstream
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "socks"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
